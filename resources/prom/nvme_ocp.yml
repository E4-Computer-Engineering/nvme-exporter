# Recording rules deriving OCP/SMART metrics from the raw values exposed by
# nvme_exporter. These stay in Prometheus (not the exporter) on purpose:
#   - rate()/predict_linear() rules are stateful and need stored history.
#   - the endurance rules embed a warranty window that is contractual, not
#     telemetry, and is easier to tune here than in a recompiled binary.
#
# Constants used below, and why each is or isn't a tunable assumption:
#   * 512000 = 1000 * 512: NVMe reports data units in THOUSANDS of 512-byte
#     units (rounded up), so bytes = value * 512000. Spec-defined, not tunable.
#   * 1e12: decimal terabyte (TB, not TiB). Unit conversion, not tunable.
#   * 273.15: Kelvin -> Celsius offset. Not tunable.
#   * 365*5: assumed 5-year warranty window for RATED DWPD. This is contractual
#     and cannot be derived from telemetry — adjust it to the drive's warranty.
#
# Endurance (remaining life / rated TBW) is derived from the device's own
# nvme_percent_used (the vendor's estimate of life consumed, which already
# accounts for real cell endurance and write amplification). This replaces the
# previous hard-coded "3000 P/E cycles" guess.
#
# Unit reference (verified against the specs):
#   * nvme_physical_media_units_written_lo/_hi: BYTES, split across the low/high
#     64 bits of a 128-bit counter (OCP spec). _lo alone covers ~18 EB, so _hi
#     is effectively always 0 and using _lo by itself is correct in practice.
#   * nvme_physical_size: bytes.  nvme_temperature: Kelvin.
#   * nvme_percent_used: vendor estimate of % life consumed (0 = new; can exceed
#     100 once the rated endurance is passed).
groups:
  - name: Nvme device Write Amplification
    rules:
      # Lifetime write-amplification factor: NAND bytes written / host bytes written.
      # Both sides are in bytes, so the ratio is dimensionless.
      # Uses _lo only, which is correct until physical writes exceed ~18 EB.
      - record: device:nvme_device_waf:total
        expr: nvme_physical_media_units_written_lo / (nvme_data_units_written * 512000)
      # NAND bytes written per second.
      - record: device:nvme_physical_media_units_written_lo:rate
        expr: rate(nvme_physical_media_units_written_lo[1m])
      # Host bytes written per second (512000 converts data units -> bytes).
      - record: device:nvme_data_units_written:rate_bytes
        expr: rate(nvme_data_units_written[5m])*512000
      # Instantaneous (windowed) write amplification = NAND write rate / host write rate.
      - record: device:nvme_device_writeamp:rate
        expr: device:nvme_physical_media_units_written_lo:rate / device:nvme_data_units_written:rate_bytes
  - name: NVMe device Temperature from K to Celsius
    rules:
      # 273.15 = absolute zero offset (Kelvin -> Celsius).
      - record: device:nvme_temperature:celsius
        expr: (nvme_temperature - 273.15)
  - name: NVMe Physical size of SSDs (in TB)
    rules:
      # 1e12 = decimal terabyte (TB, not TiB). round to 2 decimal places.
      - record: device:nvme_physical_size:TB
        expr: round(nvme_physical_size / 1000000000000, 0.01)
  - name: Estimation of the device remaining life
    rules:
      # Device Remaining Life % straight from the vendor's own wear estimate.
      # No P/E-cycle assumption: nvme_percent_used already reflects real endurance
      # and write amplification. clamp_min floors it at 0 once life is exceeded.
      - record: device:DRL_calculated
        expr: clamp_min(100 - nvme_percent_used, 0)
  - name: Rated TBW implied by the vendor wear estimate (in TB)
    rules:
      # Total host TB the drive implies it can take = host_TB_written / fraction_used.
      # 512000: data units -> bytes; 1e12: bytes -> TB. Guarded to percent_used > 0
      # so it is not emitted (avoids div-by-zero) until the drive has measurable wear.
      - record: device:TBW_calculated
        expr: (((nvme_data_units_written * 512000) / 1e12) / (nvme_percent_used / 100)) and (nvme_percent_used > 0)
  - name: Prediction of DRL in 4 hours
    rules:
      # Linear extrapolation of DRL over the next 4h (4*3600 s).
      # NOTE: nvme_percent_used is coarse (integer %, updated infrequently), so a
      # short lookback often yields a flat slope; [6h] gives predict_linear enough
      # history to detect movement. predict_linear is stateful -> Prometheus only.
      - record: device:projected_DRL_4h
        expr: predict_linear(device:DRL_calculated[6h], 4*3600)
  - name: Calculation of Drives Writes per Day (DWPD)
    rules:
      # RATED DWPD = rated_TBW / (warranty_days * capacity_TB).
      # 365*5 = assumed 5-year warranty window — adjust to the drive's warranty.
      - record: device:DWPD_calculated
        expr: device:TBW_calculated / on(device) (365*5*device:nvme_physical_size:TB)
      # OBSERVED (recent) DWPD = host bytes/day / capacity_bytes.
      # 512000: data units -> bytes; 86400: per-second rate -> per-day. rate() is
      # stateful, so this can only be computed here, not by the stateless exporter.
      # Window [1d] is a rolling daily average; shorten (e.g. [3h]) for responsiveness.
      - record: device:DWPD_observed
        expr: (rate(nvme_data_units_written[1d]) * 512000 * 86400) / on(device) nvme_physical_size
      # LIFETIME-AVERAGE DWPD = total host bytes / capacity / powered-on days.
      # Constant-free and computable from a single scrape. NOTE: nvme_power_on_hours
      # is powered-on time, not calendar time, so a drive that is often off will
      # show a higher lifetime DWPD than its true per-calendar-day rate.
      - record: device:DWPD_lifetime
        expr: ((nvme_data_units_written * 512000) / on(device) nvme_physical_size) / (nvme_power_on_hours / 24)
